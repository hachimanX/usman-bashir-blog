name = "usman-bashir-blog"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Wrangler creates the DNS records and TLS certificates for these on deploy.
# Any pre-existing record for the same hostname must be deleted first.
routes = [
  { pattern = "usmanbashir.net", custom_domain = true },
  { pattern = "www.usmanbashir.net", custom_domain = true },
]

# The site is static. `npm run build` prerenders every page into dist/public
# (see scripts/prerender.mjs), and Cloudflare serves those files from its edge
# cache: no worker invocation, no database, on any page view.
#
# /about is served from about.html, /article/x from article/x.html (the default
# html_handling resolves extensionless URLs to .html files). Unknown paths get
# the prerendered 404.html with a real 404 status.
#
# Noindex is no longer a variable here: it is SITE_NOINDEX in shared/site.ts,
# applied at build time as a meta tag and an X-Robots-Tag header.
[assets]
directory = "./dist/public"
binding = "ASSETS"
not_found_handling = "404-page"
# Only the newsletter signup endpoint needs the worker.
run_worker_first = ["/api/*"]
